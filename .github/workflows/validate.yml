name: validate
on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Validate Streamlit Community Cloud deployment install path
        run: python -m pip install -r requirements.txt
      - name: Verify package imports and app compilation
        run: |
          python -c "import financial_radar; print('Imported financial_radar from', financial_radar.__file__)"
          python -m compileall -q src app.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run full test suite
        run: python -m pytest -q